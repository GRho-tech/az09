</main>

const CONSONNES = { B: 2, C: 2, D: 3, F: 2, G: 2, H: 2, J: 1, K: 1,
  L: 5, M: 3, N: 6, P: 2, Q: 1, R: 6, S: 6, T: 6, V: 2, W: 1, X: 1, Z: 1 };

/* Normalisation insensible aux accents et ligatures :
   ç→c, é è ê ë→e, à â ä→a, etc., œ→oe, æ→ae */
function normaliser(s) {
  return s
    .toLowerCase()
    .replace(/œ/g, "oe").replace(/æ/g, "ae")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/ç/g, "c")
    .replace(/[^a-z]/g, "")
    .toUpperCase();
}

const dicIndex = new Set();                   // recherche rapide par mot
let motsParLongueur = null;                   // index par longueur pour la recherche de solutions

function indexerDictionnaire() {
  dicIndex.clear();
  for (const mot of DICTIONNAIRE) dicIndex.add(mot);
  motsParLongueur = [];
  for (const mot of DICTIONNAIRE) {
    const n = mot.length;
    if (n <= 10) {
      if (!motsParLongueur[n]) motsParLongueur[n] = [];
      motsParLongueur[n].push(mot);
    }
  }
}

function statutDic(texte) {
  const el = document.getElementById("statut-dico");
  el.textContent = texte;
}

function chargerDictionnaire() {
  try {
    statutDic("Chargement du dictionnaire…");
    // Laisse le navigateur respirer : découpage en tranches
    const mots = DIC_TEXTE.trim().split(/\s+/);
    const normalises = [];
    for (let i = 0; i < mots.length; i += 5000) {
      for (const m of mots.slice(i, i + 5000)) {
        const n = normaliser(m);
        if (n.length >= 2 && n.length <= 10) normalises.push(n);
      }
    }
    DICTIONNAIRE = Array.from(new Set(normalises));
    indexerDictionnaire();
    statutDic("Dictionnaire chargé : " + DICTIONNAIRE.length.toLocaleString("fr-FR") + " mots.");
  } catch (e) {
    DICTIONNAIRE = [];
    indexerDictionnaire();
    statutDic("Erreur de chargement du dictionnaire (" + e.message + ").");
  }
}

let tirage = [];
let debutTirage = Date.now();

/* Formate une durée en secondes : "3 s", "1 min 25 s" */
function formaterDuree(ms) {
  const s = Math.round(ms / 1000);
  if (s < 60) return s + " s";
  return Math.floor(s / 60) + " min " + (s % 60) + " s";
}

/* Tirage pondéré : au moins 3 voyelles, au plus 7 (sur 10 lettres) */
function tirerLettre(table) {
  let total = 0;
  for (const p of Object.values(table)) total += p;
  let r = Math.random() * total;
  for (const [l, p] of Object.entries(table)) {
    r -= p;
    if (r <= 0) return l;
  }
  return Object.keys(table).pop();
}

function nouveauTirage() {
  const nbVoyelles = 3 + Math.floor(Math.random() * 5); // 3 à 7
  let lettres = [];
  for (let i = 0; i < nbVoyelles; i++) lettres.push(tirerLettre(VOYELLES));
  for (let i = nbVoyelles; i < 10; i++) lettres.push(tirerLettre(CONSONNES));
  // Mélanger pour ne pas révéler la répartition
  for (let i = lettres.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [lettres[i], lettres[j]] = [lettres[j], lettres[i]];
  }
  tirage = lettres;
  debutTirage = Date.now();
  document.getElementById("lettres").textContent = tirage.join(" ");
  document.getElementById("resultat").className = "neutre";
  document.getElementById("resultat").textContent = "Nouveau tirage de 10 lettres.";
  const input = document.getElementById("proposition");
  input.value = "";
  input.focus();
}

/* Compte combien de fois le mot peut être formé avec les lettres disponibles */
function lettresDisponibles(mot) {
  const dispo = {};
  for (const l of tirage) dispo[l] = (dispo[l] || 0) + 1;
  for (const l of mot) {
    if (!dispo[l]) return false;
    dispo[l]--;
  }
  return true;
}

function rechercherSolutions() {
  // Parcourt les longueurs de 10 à 2 : dès qu'on trouve, c'est la meilleure
  for (let n = 10; n >= 2; n--) {
    const candidats = (motsParLongueur[n] || []).filter(lettresDisponibles);
    if (candidats.length) {
      return "Solutions les plus longues (" + n + " lettres) : " +
             candidats.slice(0, 50).join(", ") +
             (candidats.length > 50 ? "… (" + candidats.length + " mots)" : "");
    }
  }
  return "Aucune solution trouvée dans le dictionnaire.";
}

document.getElementById("nouveau").addEventListener("click", nouveauTirage);

function verifier() {
  const zone = document.getElementById("resultat");
  const mot = normaliser(document.getElementById("proposition").value);
  const duree = formaterDuree(Date.now() - debutTirage);
  if (!mot) {
    zone.className = "err";
    zone.textContent = "Veuillez saisir un mot.";
    return;
  }
  if (mot.length > 10) {
    zone.className = "err";
    zone.textContent = "Vous avez trouvé en " + duree + " « " + mot + " » qui dépasse 10 caractères.";
    return;
  }
  if (!lettresDisponibles(mot)) {
    zone.className = "err";
    zone.textContent = "Vous avez trouvé en " + duree + " « " + mot + " » qui n'est pas un mot correct (lettres absentes du tirage).";
    return;
  }
  if (!dicIndex.has(mot)) {
    zone.className = "err";
    zone.textContent = "Vous avez trouvé en " + duree + " « " + mot + " » qui n'est pas un mot correct (mot inconnu du dictionnaire).";
    return;
  }
  zone.className = "ok";
  zone.textContent = "Vous avez trouvé en " + duree + " « " + mot + " » qui est un mot correct (" + mot.length +
    " lettres). " + rechercherSolutions();
}

document.getElementById("verifier").addEventListener("click", verifier);
// Entrée dans le champ = vérifier (sans soumettre le formulaire)
document.getElementById("proposition").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { e.preventDefault(); verifier(); }
});

nouveauTirage();
chargerDictionnaire();
</script>
